[bar.default]
background_opacity = 0.52999998815357685
center = [ "clock", "spacer_2", "notifications" ]
concave_edge_corners = false
end = [
    "media",
    "tray",
    "spacer_3",
    "clipboard",
    "bluetooth",
    "network",
    "volume",
    "brightness",
    "battery",
    "control-center"
]
font_family = "Geist"
margin_ends = 0
padding = 24
radius = 0
scale = 0.90000000596046448
start = [ "session", "spacer_4", "launcher", "wallpaper", "workspaces" ]

[calendar]
enabled = true

[control_center]
hidden_tabs = [ "media", "audio", "calendar", "notifications" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "dark_mode"

[dock]
background_opacity = 0.48999998904764652
enabled = true
icon_size = 39
pinned = [ "helium" ]

[location]
address = "Zielona Góra, Poland"

[lockscreen]
transition = [ "crt" ]
transition_duration = 500

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@DP-5",
    "lockscreen-login-box@DP-3",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
