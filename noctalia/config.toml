[shell]
external_ip_enabled = true
font_family = "Geist"

    [shell.panel]
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "niri" ]
    community_ids = [ "fuzzel", "yazi" ]

[wallpaper]
directory = "/home/bartek/Pictures"
transition = [ "crt", "disc", "fade", "golden", "honeycomb", "melt", "pixel", "stripes", "vortex", "wipe", "zoom" ]
transition_duration = 800
transition_on_startup = true

    [wallpaper.default]
    path = "/home/bartek/Pictures/wallhaven-xed38l.png"

    [wallpaper.last]
    path = "/home/bartek/Pictures/wallhaven-xed38l.png"

    [wallpaper.monitors.DP-3]
    path = "/home/bartek/Pictures/wallhaven-xed38l.png"

    [wallpaper.monitors.DP-5]
    path = "/home/bartek/Pictures/wallhaven-xed38l.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/bartek/Pictures/wallhaven-xed38l.png"

